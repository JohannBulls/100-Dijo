<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <!-- Logotipo original de «100 Dijeron» (creado para este proyecto, licencia MIT). -->
  <title id="t">100 Dijeron</title>
  <defs>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="globo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#sombra)">
    <!-- Globo de diálogo: «lo que dijo la gente» -->
    <path d="M60 30 H420 a40 40 0 0 1 40 40 V170 a40 40 0 0 1 -40 40 H190 L130 262 L142 210 H60 a40 40 0 0 1 -40 -40 V70 a40 40 0 0 1 40 -40 Z"
          fill="url(#globo)" stroke="#fbbf24" stroke-width="8"/>
    <!-- Destellos -->
    <g fill="#fde68a">
      <path d="M58 62 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 Z"/>
      <path d="M418 150 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 Z"/>
    </g>
    <!-- «100» -->
    <text x="240" y="160" text-anchor="middle" font-family="Bebas Neue, Impact, Arial Narrow, sans-serif"
          font-size="150" font-weight="700" fill="url(#oro)" stroke="#7c2d12" stroke-width="5" paint-order="stroke"
          letter-spacing="6">100</text>
    <!-- Cinta «DIJERON» -->
    <path d="M150 196 H330 L346 218 L330 240 H150 L134 218 Z" fill="url(#cinta)" stroke="#fde68a" stroke-width="4"/>
    <text x="240" y="232" text-anchor="middle" font-family="Bebas Neue, Impact, Arial Narrow, sans-serif"
          font-size="38" fill="#fff" letter-spacing="7">DIJERON</text>
  </g>
</svg>
