name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  pruebas:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      # El Excel original no se publica (datos personales): sus pruebas se omiten con aviso.
      - name: Ejecutar pruebas
        run: python -m unittest discover -s pruebas -v
